version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # devDependencies only - the package itself has zero runtime dependencies.
    groups:
      dev-dependencies:
        patterns: ['*']
        # Keep routine updates together, but let breaking tool migrations land
        # as focused PRs with their own configuration/runtime changes.
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
