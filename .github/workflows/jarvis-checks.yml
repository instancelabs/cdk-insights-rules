name: Jarvis pull request checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: jarvis-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  quality:
    name: Jarvis quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      - name: Verify the complete package and maintenance policy
        run: |
          node --test .github/jarvis/*.checks.mjs
          npm run typecheck
          npm run test
          npm run build
          npm run lint
