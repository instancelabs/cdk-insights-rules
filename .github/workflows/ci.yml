name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Hard gates - a rule cannot merge without passing all of these.
      - name: Security scan (rule files must be pure)
        run: npm run security-scan
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test (behaviour + contract)
        run: npm test
      - name: Build
        run: npm run build

      # Keep the generated catalog in sync with the registered rules.
      - name: Catalog is up to date
        run: |
          npm run build:catalog
          git diff --exit-code CATALOG.md \
            || (echo "::error::CATALOG.md is stale - run 'npm run build && npm run build:catalog' and commit." && exit 1)
